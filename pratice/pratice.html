<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Document</title>
    <!-- Bootstrap 4 CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="siu.css" />
  </head>
  <body>
    <a href="https://www.naver.com" target="_blank"
      ><img src="cloud.png" alt=""
    /></a>
  </body>
  <div id="carouselExampleControls" class="carousel slide" data-ride="carousel">
    <div class="carousel-inner">
      <!-- 첫 번째 이미지 -->
      <div class="carousel-item active">
        <img class="d-block w-100" src="siu.jpg" alt="첫 번째 영화" />
      </div>

      <!-- 두 번째 이미지 -->
      <div class="carousel-item">
        <img class="d-block w-100" src="siu.jpg" alt="두 번째 영화" />
      </div>

      <!-- 세 번째 이미지 -->
      <div class="carousel-item">
        <img class="d-block w-100" src="siu.jpg" alt="세 번째 영화" />
      </div>
    </div>

    <!-- 이전 버튼 -->
    <a
      class="carousel-control-prev"
      href="#carouselExampleControls"
      role="button"
      data-slide="prev"
    >
      <span class="carousel-control-prev-icon"></span>
      <span class="sr-only">Previous</span>
    </a>

    <!-- 다음 버튼 -->
    <a
      class="carousel-control-next"
      href="#carouselExampleControls"
      role="button"
      data-slide="next"
    >
      <span class="carousel-control-next-icon"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>

  <!-- Bootstrap 4 작동에 필요한 JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</html>
