<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>Document</title>
  </head>
  <body>
    <h1>연습</h1>
    <p>연습용 페이지입니다.</p>
    <ul>
      <li>리스트1</li>
      <li>리스트2</li>
    </ul>

    <textarea
      name="text"
      id="text"
      cols="30"
      rows="10"
      placeholder="글자를 입력해주세요"
    >
    </textarea>
    <div>
      <h1>안녕하세요</h1>
      <p>테스트</p>
      <button>버튼</button>
    </div>
    <input type="checkbox" name="check" id="check" checked />
    <label for="check">체크박스</label>

    <div>
      <form action="">
        <input
          type="text"
          name="name"
          id="name"
          placeholder="이름을 입력하세요"
        />
        <input type="password" />
        <input type="submit" value="제출" />
      </form>
    </div>
  </body>
</html>
